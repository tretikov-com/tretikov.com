name: Deploy site to GitHub Pages

# This site has no build step. The job exists only so the deployed tree can
# differ from the repository tree: AGENTS.md is shared with developers through
# the repo but is never published to the web. Legacy Pages served the branch
# verbatim, which left no way to hold a file back.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # The per-person sites are submodules and are served under /max,
          # /alexei, and /lila. Without them those paths 404.
          submodules: recursive

      - name: Stage the publishable tree
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '/.github' \
            --exclude '/_site' \
            --exclude '/AGENTS.md' \
            ./ _site/
          test ! -e _site/AGENTS.md
          test -e _site/index.html
          test -e _site/max/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
